<!doctype html>
<html lang="es" data-theme="{{ default_theme }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7EFD9" />
    <meta
      name="description"
      content="CruciWord: crucigramas de vocabulario en inglés, sin prisa y sin presión."
    />
    <title>{% block title %}CruciWord{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <script src="/static/js/theme-init.js"></script>
  </head>
  <body class="cw-page font-cw bg-cw-bg text-cw-ink">
    <a class="cw-skip" href="#contenido">Saltar al contenido</a>
    {% include "partials/header.html" %}
    <main id="contenido" class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
    <script src="/static/js/storage.js" defer></script>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/theme.js" defer></script>
    <script src="/static/js/audio.js" defer></script>
    <script src="/static/js/grid-engine.js" defer></script>
    <script src="/static/js/board.js" defer></script>
    <script src="/static/js/navigation.js" defer></script>
    <script src="/static/js/keyboard.js" defer></script>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
